name="kanchor77"></a>Fixture</h1><p>It is possible to copy an existing fixture and edit its parameters. In the fixture editor, there is a <span class="Emphasis">{Copy}</span> button. Pressing <span class="Emphasis">{Copy}</span> when a library fixture is selected will create a copy of that fixture and will assign it a new name.</p></body></html>
