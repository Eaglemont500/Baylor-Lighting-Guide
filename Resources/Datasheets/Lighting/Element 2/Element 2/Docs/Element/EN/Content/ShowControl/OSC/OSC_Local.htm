ntered in the console (via the Magic Sheet command object) that begin with <span class="Emphasis">local:</span> will be looped back into the console.</p><div class="ForExample"><p class="ForExample" data-mc-autonum="&lt;span style=&quot;font-size: 13pt;&quot; class=&quot;mcFormatSize&quot;&gt;&lt;b&gt;For Example:&lt;/b&gt;&lt;/span&gt;"><span class="autonumber"><span><span style="font-size:13pt" class="mcFormatSize"><b>For Example:</b></span></span></span>&#160;</p><ul><li value="1"><span class="Emphasis">local:/eos/chan/1/at/50</span></li></ul></div><p>When executed, the console will send itself the OSC command to set Channel 1 to 50%.</p></body></html>
