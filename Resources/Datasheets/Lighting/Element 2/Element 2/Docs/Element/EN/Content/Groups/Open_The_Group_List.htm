>The group list allows viewing and editing of groups.</p><p>To open the group list you can:</p><ul><li value="1">Press <span class="Emphasis">[Group] [Group]</span></li><li value="2">Press <span class="Emphasis">[Tab] [1] [7]</span></li></ul><p>You can navigate within the group list using <span class="Emphasis">[Next] </span>and <span class="Emphasis">[Last] </span>or by selecting the group you want to work with.</p></body></html>
